name: Публикация в Telegram

# Запуск ежечасный, потому что GitHub задерживает cron на часы, а иногда
# пропускает целиком: наблюдались опоздания до семи часов и полный пропуск дня.
# Слот выбирает publish.py по московскому времени, любой поздний запуск
# догоняет пропущенный слот. Повторной отправки не будет: опубликованный
# файл уезжает в published/, и следующий час его уже не находит.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Слот (по умолчанию определяется по времени)'
        required: false
        default: ''
        type: choice
        options: ['', main, companion]
      date:
        description: 'Дата поста (YYYY-MM-DD) — для пропущенного выпуска'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: pip install -r bot/requirements.txt

      - name: Публикация
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SLOT: ${{ github.event.inputs.slot }}
          DATE: ${{ github.event.inputs.date }}
        run: python bot/publish.py

      - name: Сохранить журнал
        run: |
          git config user.name "Content Factory Bot"
          git config user.email "bot@content-factory"
          git add posts/ published/
          git diff --cached --quiet || git commit -m "Опубликован пост $(date +'%Y-%m-%d')"
          git push
