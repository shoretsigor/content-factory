name: Публикация в Telegram

# Запускается каждый день в оба слота, но publish.py сам решает, публикационный
# ли сегодня день (start_date + 2 x n из channel.yml). В неактивный день выходит молча.
on:
  schedule:
    - cron: '0 9 * * *'    # 12:00 МСК — основной пост
    - cron: '0 16 * * *'   # 19:00 МСК — дополнение, если оно подготовлено
  workflow_dispatch:
    inputs:
      slot:
        description: 'Слот'
        required: false
        default: 'main'
        type: choice
        options: [main, companion]
      date:
        description: 'Дата поста (YYYY-MM-DD) — для пропущенного выпуска'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Определить слот
        run: |
          if [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            echo "SLOT=main" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 16 * * *" ]; then
            echo "SLOT=companion" >> $GITHUB_ENV
          else
            echo "SLOT=${{ github.event.inputs.slot || 'main' }}" >> $GITHUB_ENV
          fi

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: pip install -r bot/requirements.txt

      - name: Публикация
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          DATE: ${{ github.event.inputs.date }}
        run: python bot/publish.py

      - name: Сохранить журнал
        run: |
          git config user.name "Content Factory Bot"
          git config user.email "bot@content-factory"
          git add posts/ published/
          git diff --cached --quiet || git commit -m "Опубликован пост $(date +'%Y-%m-%d'), слот ${SLOT}"
          git push
