# Настройки канала. Читаются и публикатором (bot/publish.py), и генератором.
# Редакционные правила — в editorial-policy.md, он источник истины по содержанию.

# Точка отсчёта ритма «через день». Активные дни: start_date + 2 x n.
# Смена месяца отсчёт не обнуляет. Менять только осознанно: сдвиг start_date
# переставляет весь календарь.
start_date: 2026-09-18
timezone: Europe/Moscow
publication_day_interval: 2

# Слоты активного дня. Основной обязателен, дополнение выходит только когда
# у генератора получился самостоятельный материал.
slots:
  main:
    time: "12:00"
    cron_utc: "0 9 * * *"
  companion:
    time: "19:00"
    cron_utc: "0 16 * * *"

# Контент готовится вручную в сессии Claude Code, пакетом на две недели.
generation:
  batch_days: 14
  wines_file: sources/wines.yml

publication_mode: auto
