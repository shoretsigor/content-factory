# Настройки канала. Читаются и публикатором (bot/publish.py), и генератором.
# Редакционные правила — в editorial-policy.md, он источник истины по содержанию.

# Ритм: два дня публикуем, один пропускаем. Цикл повторяется от start_date
# без привязки к дням недели, смена месяца отсчёт не обнуляет.
# Менять только осознанно: сдвиг start_date переставляет весь календарь.
start_date: 2026-09-22
timezone: Europe/Moscow
rhythm:
  cycle_days: 3
  active_offsets: [0, 1]

# Слоты активного дня, время московское. Основной обязателен, дополнение
# выходит только когда получился самостоятельный материал.
# Публикатор запускается ежечасно и берёт первый слот, чьё время наступило,
# а материал ещё не отправлен: так поздний запуск догоняет пропущенный.
slots:
  main:
    time: "12:00"
  companion:
    time: "19:00"

# Контент готовится вручную в сессии Claude Code, пакетом на две недели.
generation:
  batch_days: 14
  wines_file: sources/wines.yml

publication_mode: auto
