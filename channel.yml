# Настройки канала. Читаются и публикатором (bot/publish.py), и генератором.
# Редакционные правила — в editorial-policy.md, он источник истины по содержанию.

# С 17 октября 2026: вторник и суббота в 14:05 по Москве.
timezone: Europe/Moscow
effective_date: 2026-10-17
publication_weekdays: [2, 6]  # ISO: понедельник = 1

# Один основной пост в публикационный день. Поздний запуск GitHub Actions
# догоняет слот в тот же день, не отправляя его второй раз.
slots:
  main:
    time: "14:05"

# Контент готовится вручную в сессии Claude Code, пакетом на две недели.
generation:
  batch_days: 14
  wines_file: sources/wines.yml

publication_mode: auto
