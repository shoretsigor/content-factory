# Бутылки для канала. Генератор берёт темы ТОЛЬКО отсюда.
#
# Политика, раздел 21.4: список вин задаёт владелец, придумывать бутылки нельзя.
# Пустой список означает, что генератору не о чем писать: он остановится
# и скажет об этом, а не выберет бутылки сам.
#
# Обязательные поля: producer, wine.
# vintage можно не указывать — тогда генератор напишет о кюве в целом
# и не станет приписывать бутылке случайный год (политика 7.2).
#
# Пример заполнения:
#
#   - producer: FONTERENZA
#     wine: "Rosso di Montalcino"
#     vintage: 2022
#     note: "необязательно: что подчеркнуть или на чём сделать акцент"
#
#   - producer: PIERO BUSSO
#     wine: "Barbaresco Gallina"
#     vintage: 2019
#
# Производители портфеля — в sources/producers.md, это справочник,
# а не список тем.

wines: []
